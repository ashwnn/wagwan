[package]
name = "wagwan"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "A small self-hosted RSS story reader"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["multipart"] }
askama = "0.14"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli", "json", "stream"] }
feed-rs = "2"
dom_smoothie = "0.13"
model2vec-rs = { version = "0.3", default-features = false, features = ["local-only", "fancy-regex"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = "0.37"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sha2 = "0.10"
time = { version = "0.3", features = ["formatting"] }
# IANA time-zone rules for WAGWAN_TZ without system tzdata in scratch images.
time-tz = { version = "2", features = ["db"] }

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[dev-dependencies]
# Exercise Axum routes in process without network access.
tower = { version = "0.5", features = ["util"] }
