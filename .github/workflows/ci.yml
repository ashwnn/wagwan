name: CI

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-targets
        env:
          WAGWAN_UI_ARTIFACT_DIR: .build/ui
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Browser tooling (development only)
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps firefox
      - run: node --check src/web/static/app.js
      - run: node scripts/browser-smoke.cjs
      - name: Live 50-feed smoke check
        run: python3 scripts/verify-m1.py --smoke --smoke-seconds 65
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification
          path: |
            .build/browser/
            .build/m1-verification/

  docker:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Build native image
        run: docker build -t wagwan:ci .
      - name: Check container startup and persistent storage
        run: |
          docker compose config --quiet
          docker volume create wagwan-test
          docker run -d --name wagwan-test -e WAGWAN_TZ=America/Vancouver -v wagwan-test:/data wagwan:ci
          for attempt in $(seq 1 30); do
            if docker exec wagwan-test /wagwan healthcheck; then break; fi
            sleep 1
          done
          docker exec wagwan-test /wagwan healthcheck
          docker cp tests/fixtures/nested-opml.xml wagwan-test:/data/feeds.opml
          docker exec wagwan-test /wagwan import-opml /data/feeds.opml
          docker restart wagwan-test
          for attempt in $(seq 1 30); do
            if docker exec wagwan-test /wagwan healthcheck; then break; fi
            sleep 1
          done
          docker exec wagwan-test /wagwan healthcheck
          docker exec wagwan-test /wagwan import-opml /data/feeds.opml | grep 'Imported 0 feeds'
          docker image inspect wagwan:ci --format 'Image bytes: {{.Size}}' >> "$GITHUB_STEP_SUMMARY"
      - name: Container logs
        if: always()
        run: docker logs wagwan-test || true
